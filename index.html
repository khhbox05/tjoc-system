<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TJOC 學刊稿件審查管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-shadow: none !important;
      text-shadow: none !important;
    }
    .tab-active {
      background-color: #1e1b4b !important;
      color: #ffffff !important;
      border-bottom: 2px solid #6366f1 !important;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased min-h-screen">

  <script>
    // 您的 Google Apps Script 正式 Web App 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbz70umh00ocelEypOfgiCq5pRkOi5Lu6W5UD3eIjwfF-R3cyJjv8O2tPVFAOMXvJHkLVw/exec";
  </script>

  <!-- 1. 未登入視窗 -->
  <div id="loginView" class="min-h-screen flex items-center justify-center p-4 bg-gray-200">
    <div class="bg-white border-2 border-gray-800 w-full max-w-md p-8">
      <div class="border-b border-gray-200 pb-5 mb-6 text-center">
        <span class="inline-block bg-indigo-700 text-white font-extrabold text-xs px-3 py-1 tracking-wider uppercase mb-3">TJOC</span>
        <h2 class="text-xl font-extrabold text-gray-900 tracking-tight">學刊編務管理系統</h2>
        <p class="text-xs text-gray-500 mt-1">管理員登入</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">管理帳號</label>
          <input type="text" id="loginUsername" required placeholder="帳號" class="w-full border border-gray-300 bg-gray-50 p-2.5 text-xs outline-none focus:border-indigo-600 focus:bg-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">管理密碼</label>
          <input type="password" id="loginPassword" required placeholder="密碼" class="w-full border border-gray-300 bg-gray-50 p-2.5 text-xs outline-none focus:border-indigo-600 focus:bg-white">
        </div>

        <div id="loginError" class="text-xs text-red-600 hidden font-bold border border-red-200 bg-red-50 p-2"></div>

        <button type="submit" id="btnLogin" class="w-full py-2.5 bg-indigo-700 hover:bg-indigo-800 text-white font-bold text-xs uppercase tracking-wider border border-indigo-900">
          登入系統
        </button>
      </form>
    </div>
  </div>

  <!-- 2. 系統主介面 -->
  <div id="mainApp" class="hidden">

    <header class="bg-gray-900 text-white border-b border-gray-800 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <span class="bg-indigo-600 text-white font-extrabold px-2.5 py-1 text-xs tracking-wider">TJOC</span>
          <h1 class="text-sm sm:text-base font-bold tracking-tight">投稿、審查與刊登編務系統</h1>
        </div>
        <div class="flex items-center space-x-2">
          <div class="hidden sm:flex items-center space-x-2 bg-gray-800 px-3 py-1 border border-gray-700 text-xs">
            <i class="fas fa-user-shield text-indigo-400"></i>
            <span id="currentUserDisplay" class="text-gray-200 font-medium">--</span>
          </div>
          <button onclick="fetchData()" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 text-xs text-gray-200 border border-gray-700">
            <i class="fas fa-sync-alt mr-1"></i> 重整
          </button>
          <button onclick="openModal('newArticleModal')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-xs text-white font-bold border border-indigo-700">
            <i class="fas fa-plus mr-1"></i> 新增收件
          </button>
          <button onclick="handleLogout()" class="px-2.5 py-1 bg-red-700 hover:bg-red-800 text-xs text-white border border-red-900" title="登出">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>

      <!-- 分頁標籤切換列 (Tabs) -->
      <nav class="max-w-7xl mx-auto px-4 flex space-x-1 overflow-x-auto text-xs font-bold border-t border-gray-800">
        <button onclick="switchTab('tab-dashboard')" id="btn-tab-dashboard" class="px-4 py-2.5 text-gray-300 hover:text-white hover:bg-gray-800 border-b-2 border-transparent transition">
          <i class="fas fa-tachometer-alt mr-1.5"></i>數據 Dashboard
        </button>
        <button onclick="switchTab('tab-progress')" id="btn-tab-progress" class="px-4 py-2.5 text-gray-300 hover:text-white hover:bg-gray-800 border-b-2 border-transparent transition tab-active">
          <i class="fas fa-tasks mr-1.5"></i>02 稿件審查進度
        </button>
        <button onclick="switchTab('tab-reviewers')" id="btn-tab-reviewers" class="px-4 py-2.5 text-gray-300 hover:text-white hover:bg-gray-800 border-b-2 border-transparent transition">
          <i class="fas fa-user-check mr-1.5"></i>01 審查人推薦與婉拒歷史
        </button>
        <button onclick="switchTab('tab-editor')" id="btn-tab-editor" class="px-4 py-2.5 text-gray-300 hover:text-white hover:bg-gray-800 border-b-2 border-transparent transition">
          <i class="fas fa-gavel mr-1.5"></i>請主編定奪
        </button>
        <button onclick="switchTab('tab-publication')" id="btn-tab-publication" class="px-4 py-2.5 text-gray-300 hover:text-white hover:bg-gray-800 border-b-2 border-transparent transition">
          <i class="fas fa-print mr-1.5"></i>04 待刊與校對排版
        </button>
        <button onclick="switchTab('tab-export')" id="btn-tab-export" class="px-4 py-2.5 text-gray-300 hover:text-white hover:bg-gray-800 border-b-2 border-transparent transition">
          <i class="fas fa-file-export mr-1.5"></i>評鑑清冊匯出
        </button>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">

      <!-- TAB 1: Dashboard -->
      <div id="tab-dashboard" class="tab-pane hidden space-y-6">
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-white border border-gray-300 p-5">
            <div class="text-xs font-bold text-gray-500 uppercase tracking-wider">總收稿數</div>
            <div id="statTotal" class="text-3xl font-extrabold text-gray-900 mt-2">--</div>
            <div class="text-xs text-gray-400 mt-1">全部收稿總量</div>
          </div>
          <div class="bg-white border border-gray-300 p-5">
            <div class="text-xs font-bold text-amber-700 uppercase tracking-wider">審查 / 修改中</div>
            <div id="statInReview" class="text-3xl font-extrabold text-amber-700 mt-2">--</div>
            <div class="text-xs text-gray-400 mt-1">多輪形審、複
